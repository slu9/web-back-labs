{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='lab8/lab8.css') }}">
{% endblock %}
{% block favicon %}
<link rel="icon" href="{{ url_for('static', filename='lab8/favicon.ico') }}">
{% endblock %}

{% block main %}
<h1>Регистрация</h1>

{% if error %}
    <div style="color: red; margin-bottom: 10px;">
        {{ error }}
    </div>
{% endif %}

<form action="/lab8/register" method="post" class="form-card">
    <div>
        <label>
            Логин:
            <input type="text" name="login">
        </label>
    </div>

    <div>
        <label>
            Пароль:
            <input type="password" name="password">
        </label>
    </div>

    <button type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
